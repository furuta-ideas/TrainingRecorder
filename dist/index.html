<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6f7"><title>R-Bodyトレーニング記録</title><link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/furuta-ideas/TrainingRecorder/ecc4ed2053d6b11ca29c4bd9eb6f65e12ae04c58/dist/icons/training-recorder-32.png"><link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/furuta-ideas/TrainingRecorder/ecc4ed2053d6b11ca29c4bd9eb6f65e12ae04c58/dist/icons/training-recorder-180.png"><link rel="manifest" href="manifest.webmanifest?v=20261015" crossorigin="use-credentials"><meta name="apple-mobile-web-app-title" content="トレーニングレコーダー"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css?v=20261015-3"></head>
<body>
<header class="appbar"><a class="brand" href="./"><img class="app-icon" src="icons/training-recorder-180.png" alt="トレーニングレコーダー"><b>R<span>·</span>Body</b><span>トレーニング記録</span></a><div class="heading"><span id="position"></span><h1 id="name">読み込み中…</h1></div></header>
<main><section class="workspace">
<div class="instructions"><strong id="prescription"></strong><p id="tip"></p><p id="learning"></p></div>
<section class="media-area" aria-label="トレーニング教材"><div class="section-label"><span id="mediaLabel">教材</span><span id="videoStatus"></span></div><div id="mediaStage" class="media-stage"><video id="video" autoplay muted loop playsinline controls hidden></video><div id="photos" class="photo-gallery"></div><p id="mediaEmpty" hidden>教材は未登録です。</p></div></section>
<section class="memo"><div class="memo-title"><span class="section-label">VOICE MEMO <span>今日の気づき</span></span><span id="micStatus" role="status">マイクOFF</span></div><div class="memo-input"><textarea id="memo" rows="3" readonly aria-label="気づきメモ" placeholder="マイクで音声入力、鉛筆で手入力できます。"></textarea><div class="memo-actions"><button id="micToggle" class="icon" type="button" aria-label="音声メモを開始" aria-pressed="false" title="マイク"></button><button id="editMemo" class="icon" type="button" aria-label="手入力する" aria-pressed="false" title="手入力"></button></div></div></section><p id="notice" role="status"></p>
</section>
<aside class="log-pane"><div class="log-heading"><h2>トレーニングログ</h2><span id="count" class="badge">0</span></div><div id="logs" class="logs"></div>
<section class="control-panel" aria-label="トレーニング操作"><div class="navigation"><button id="prev" class="icon" type="button" aria-label="前のトレーニング"></button><button id="next" class="icon" type="button" aria-label="次のトレーニング"></button><select id="menuSelect" aria-label="トレーニングを選択"></select></div><button id="startStop" type="button" class="start-stop" aria-pressed="false">開始</button><div id="clock" class="clock" role="timer" aria-label="現在時刻"><span id="wallClock">00:00:00</span></div><div class="elapsed"><span>実施時間（累計）</span><strong id="elapsed">00:00</strong></div><button id="endWorkout" type="button" class="end-workout">トレーニング終了</button></section></aside></main>
<script type="module" src="app.js?v=20261015-3"></script></body></html>
