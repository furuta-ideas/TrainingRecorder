<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6f7"><title>R-Bodyトレーニング記録</title><link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/furuta-ideas/TrainingRecorder/ecc4ed2053d6b11ca29c4bd9eb6f65e12ae04c58/dist/icons/training-recorder-32.png"><link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/furuta-ideas/TrainingRecorder/ecc4ed2053d6b11ca29c4bd9eb6f65e12ae04c58/dist/icons/training-recorder-180.png"><link rel="manifest" href="manifest.webmanifest?v=20261015" crossorigin="use-credentials"><meta name="apple-mobile-web-app-title" content="トレーニングレコーダー"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="style.css?v=20261017-2"></head>
<body>
<header class="appbar"><a class="brand" href="./"><img class="app-icon" src="icons/training-recorder-180.png" alt="トレーニングレコーダー"><b>R<span>·</span>Body</b><span>トレーニング記録</span></a><div class="heading"><span id="position"></span><h1 id="name">読み込み中…</h1></div><div class="top-actions"><div id="clock" class="clock" role="timer" aria-label="現在時刻"><span id="wallClock">00:00:00</span></div><button id="audioToggle" role="switch" aria-checked="false" type="button">音声 OFF</button><button id="endWorkout" type="button" class="end-workout">トレーニング終了</button></div></header>
<main><section class="workspace">
<div id="instructions" class="instructions" tabindex="0" role="button" aria-haspopup="dialog" aria-label="メニューのメモを編集。クリックまたはEnter" title="クリックで編集"><strong id="prescription"></strong><p id="tip"></p><p id="learning"></p></div>
<section class="media-area" aria-label="トレーニング教材"><div class="section-label"><span id="mediaLabel">教材</span><span id="videoStatus"></span></div><div id="mediaStage" class="media-stage"><video id="video" autoplay muted loop playsinline controls hidden></video><div id="photos" class="photo-gallery"></div><p id="mediaEmpty" hidden>教材は未登録です。</p></div></section>
<p id="notice" role="status"></p>
</section>
<aside class="log-pane"><div class="log-heading"><h2>トレーニングログ</h2><span id="count" class="badge">0</span></div><div id="logs" class="logs"></div>
</aside></main><footer class="control-panel" aria-label="トレーニング操作"><button id="menuSelect" type="button" aria-haspopup="dialog" aria-label="トレーニングリスト。長押しで並べ替え"></button><button id="prev" class="icon" type="button" aria-label="前のトレーニング"></button><button id="next" class="icon" type="button" aria-label="次のトレーニング"></button><div class="elapsed"><span>実施時間（累計）</span><strong id="elapsed">00:00</strong><small>残り <span id="remaining">01:00</span></small></div><button id="startStop" type="button" class="start-stop" aria-pressed="false">トレーニング開始</button></footer>
<dialog id="menuDialog" aria-labelledby="menuTitle"><h2 id="menuTitle">トレーニングリスト</h2><p id="menuHint">種目を選んで移動します。</p><div id="menuRows"></div><p id="orderError" role="alert"></p><div class="dialog-actions"><button id="editOrder" type="button">順番を変更</button><button id="saveOrder" type="button" hidden>順番を保存</button><button id="cancelOrder" type="button">閉じる</button></div></dialog><dialog id="noteDialog" aria-labelledby="noteTitle"><form id="noteForm"><h2 id="noteTitle">メニューのメモを編集</h2><p id="noteMenuName"></p><p class="note-help">このメニューの内容を、この端末に保存します。</p><label>回数・時間<input id="notePrescription" required maxlength="300"></label><label>自動タイマー（秒・0は手動終了）<input id="noteTimer" type="number" min="0" max="3600" step="1" required></label><label>トレーニングのポイント<textarea id="noteTip" rows="3" maxlength="3000"></textarea></label><label>補足・気づき<textarea id="noteLearning" rows="3" maxlength="3000"></textarea></label><p id="noteError" role="alert"></p><div class="dialog-actions"><button id="saveNote" type="submit">保存</button><button id="cancelNote" type="button">キャンセル</button></div></form></dialog><dialog id="endDialog" aria-labelledby="endTitle"><h2 id="endTitle">メールでトレーニング結果を送信しますか？</h2><p id="endMessage" role="status">今日の記録を保存しました。</p><div class="dialog-actions"><button id="sendAndClose" type="button">メールで送信</button><button id="finishClose" type="button" hidden>終了</button><button id="skipAndClose" type="button">送信せず終了</button><button id="cancelEnd" type="button">戻る</button></div></dialog><section id="closedScreen" hidden aria-labelledby="closedTitle"><h1 id="closedTitle">トレーニングを終了しました</h1><p id="closedMessage"></p><p>このタブまたはホーム画面のアプリを閉じてください。</p><button id="retryClose" type="button">閉じる</button><button id="returnApp" type="button">アプリに戻る</button></section><script type="module" src="app.js?v=20261017-2"></script></body></html>
