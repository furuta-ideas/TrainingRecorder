<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6f7"><title>R-Bodyトレーニング記録</title><link rel="stylesheet" href="style.css"></head>
<body><header class="appbar"><a class="brand" href="./"><b>R<span>·</span>Body</b><span>トレーニング記録</span></a><div class="tools"><span id="date"></span><button id="export" title="記録をバックアップ">記録を書き出す</button><button id="manage" title="メニュー管理">＋ メニュー</button></div></header>
<main><section class="workspace"><div class="training-head"><div class="heading"><span class="eyebrow" id="position"></span><h1 id="name">読み込み中…</h1><div class="navigation"><button id="prev" class="icon" aria-label="前のトレーニング"></button><button id="next" class="icon" aria-label="次のトレーニング"></button><select id="menuSelect" aria-label="トレーニングを選択"></select></div></div><div class="instructions"><strong id="prescription"></strong><p id="tip"></p><p id="learning"></p></div></div>
<div class="materials"><aside class="photos"><div class="section-label">PHOTO <span>フォームを確認</span></div><div id="photos"></div></aside><section class="video-area"><div class="section-label">MOVIE <span>自動・繰り返し再生</span></div><div class="screen"><video id="video" autoplay muted loop playsinline controls></video><div id="noVideo"></div></div><div class="video-caption"><span id="videoStatus"></span><a href="https://app.notion.com/p/3f4cbc412aed80d7843cff3739c0a0a3" target="_blank" rel="noopener">Notionの教材 ↗</a></div></section></div>
<section class="memo"><div class="memo-title"><span class="section-label">VOICE MEMO <span>今日の気づき</span></span><span id="micStatus" role="status">手入力もできます</span></div><div class="memo-input"><textarea id="memo" rows="3" readonly placeholder="ここをタップ：音声メモと計測を開始／もう一度タップ：停止"></textarea><button id="editMemo" type="button">手入力</button></div></section><p id="notice" role="status"></p></section>
<aside class="log-pane"><div class="log-heading"><div><span class="eyebrow">YOUR PROGRESS</span><h2>トレーニングログ</h2></div><span id="count" class="badge">0</span></div><div id="logs" class="logs"></div><div class="timer-panel"><div class="section-label">TRAINING TIMER <span id="timerState">待機中</span></div><div id="clock" class="clock idle" role="timer" aria-label="トレーニング時計"><span id="wallClock">00:00:00</span><small id="timerHint">音声メモ欄をタップして開始</small></div><div class="elapsed"><span>実施時間</span><strong id="elapsed">00:00</strong></div><p>一時停止・再開できます。<br>メニュー移動時にログへ保存。</p><button id="finish">このトレーニングを保存</button></div></aside></main>
<dialog id="manager"><form id="addForm"><h2>メニューを追加</h2><p>新しい教材を登録できます。既存メニューの記録は引き継がれます。</p><label>トレーニング名<input name="name" required maxlength="80"></label><label>回数・セット数<input name="prescription" required placeholder="例：2セット × 10回"></label><label>時間<input name="durationNote" required placeholder="例：30秒／時間指定なし"></label><label>フォームのコツ<textarea name="tips" required maxlength="180"></textarea></label><label>静止画<input name="photos" type="file" accept="image/*" multiple></label><label>動画<input name="video" type="file" accept="video/*"></label><div class="dialog-actions"><button type="button" id="closeManager">閉じる</button><button type="submit">追加する</button></div><p id="addStatus" role="status"></p></form><hr><label>バックアップから復元<input id="restore" type="file" accept=".json,application/json"></label></dialog>
<script type="module" src="app.js"></script></body></html>
