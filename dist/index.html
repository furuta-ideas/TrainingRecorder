<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6f7">
<title>ジムトレーニングアプリ</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/training-recorder-32.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest?v=20261021">
<meta name="apple-mobile-web-app-title" content="トレーニングレコーダー"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css?v=20261022-1">
</head><body class="opening">
<section id="openingScreen" class="opening-screen" role="status" aria-label="オープニング">
 <img src="icons/opening-20261021.png" alt="トレーニングレコーダー ジムトレーニングアプリ">
 <p>更新日時：2026年10月21日</p>
</section>
<div id="app" class="app" inert>
 <header class="appbar">
  <img class="app-icon" src="icons/training-recorder-180.png" alt="">
  <div class="heading"><span id="position"></span><button id="name" type="button" aria-haspopup="dialog">読み込み中…</button></div>
  <time id="wallClock" aria-label="現在時刻">00:00:00</time>
  <button id="endWorkout" class="end-workout" type="button">トレーニング終了</button>
 </header>
 <main>
  <nav class="menu-pane" aria-label="トレーニングメニュー"><ol id="menuList"></ol></nav>
  <section class="content-pane">
   <button id="instructions" class="instructions" type="button" aria-haspopup="dialog"><span id="memo"></span><small>クリックして編集</small></button>
   <section class="media-area" aria-label="トレーニング教材"><span id="mediaLabel" class="section-label"></span><div id="mediaStage" class="media-stage"><video id="video" autoplay muted loop playsinline controls hidden></video><div id="photos" class="photo-gallery"></div><p id="mediaEmpty" hidden>教材は未登録です。</p></div></section>
   <section class="timeline-wrap" aria-label="5秒ごとのトレーニング進行"><div class="timeline-scale"><span>0</span><span>30</span><span>60</span><span>90</span><span>120秒</span></div><div id="timeline" class="timeline"></div></section>
  </section>
 </main>
 <footer><div class="workout-status"><span id="statusText">スタンバイ</span><strong id="elapsed">00:00</strong><span id="currentCue"></span></div><button id="startWorkout" type="button">トレーニング開始</button></footer>
</div>
<dialog id="menuDialog"><h2>トレーニングを選択・並べ替え</h2><p>種目を選択できます。右のハンドルをドラッグして順番を変更できます。</p><div id="menuRows"></div><div class="dialog-actions"><button id="closeMenu" type="button">閉じる</button></div></dialog>
<dialog id="editDialog"><form id="editForm"><h2>種目名・メモを編集</h2><label>種目名<input id="editName" maxlength="80" required></label><label>トレーニングメモ<textarea id="editMemo" rows="4" maxlength="500" required></textarea></label><p>改行は2行まで表示されます。</p><div class="dialog-actions"><button type="submit">保存</button><button id="cancelEdit" type="button">キャンセル</button></div></form></dialog>
<dialog id="finishDialog"><h2 id="finishTitle">トレーニングを終了しますか？</h2><p id="finishMessage">進行中のトレーニングを終了します。</p><div class="dialog-actions"><button id="confirmFinish" type="button">終了する</button><button id="cancelFinish" type="button">戻る</button></div></dialog>
<section id="completeScreen" class="complete-screen" hidden><img src="icons/training-recorder-180.png" alt=""><h1>おつかれさまでした</h1><p>本日のトレーニングは終了です。</p><button id="restart" type="button">最初から始める</button></section>
<script type="module" src="app.js?v=20261022-1"></script></body></html>
